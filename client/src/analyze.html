<!DOCTYPE html>
<html lang="en">

<head>
    <title>WiiM Now Playing - Lyrics Analysis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="scss/analyze.scss">
</head>

<body>
    <main class="analyze-page container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xxl-10">
                <header class="mb-4">
                    <h1 class="mb-1">Lyrics Lookup Analysis</h1>
                    <p class="text-muted mb-0">Chronological list of failed LRCLIB lookups.</p>
                </header>

                <section class="controls card shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap gap-3 align-items-center justify-content-between">
                        <div>
                            <label for="failureLimit" class="form-label mb-1">Max entries</label>
                            <select id="failureLimit" class="form-select">
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="250" selected>250</option>
                                <option value="500">500</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2 align-items-end">
                            <button id="btnReload" class="btn btn-primary" type="button">Reload</button>
                            <span id="entryCounter" class="text-muted small"></span>
                        </div>
                    </div>
                </section>

                <section id="failuresContainer" class="vstack gap-3"></section>
            </div>
        </div>
    </main>

    <script src="js/analyze.js"></script>
</body>

</html>
